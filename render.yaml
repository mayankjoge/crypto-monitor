services:
  - type: web
    name: crypto-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    envVars:
      - key: MOCK_MODE
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
